<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ninebot synthetic history map fixture</title>
<style>body{margin:20px auto;max-width:850px;padding:0 16px;background:#121b22;color:#eee;font:16px system-ui;--primary-text-color:#eee;--secondary-text-color:#aab7c5;--primary-color:#03a9f4;--divider-color:#40505c;--card-background-color:#18232b;--secondary-background-color:#1d2731;--error-color:#ff5252}ha-card{display:block;border:1px solid #40505c;border-radius:16px}pre{white-space:pre-wrap} @media(prefers-color-scheme:light){body{background:#edf1f5;color:#222;--primary-text-color:#222;--secondary-text-color:#525964;--primary-color:#1c6bce;--divider-color:#ccd3de;--card-background-color:#fff;--secondary-background-color:#edf1f5}}</style>
<h1>Synthetic vehicles · offline fixture</h1>
<p>No real account or ride data. Map tiles are disabled.</p>
<script type="module">
import '/ninebot-static/ninebot-trip-card.js';
import { syntheticDetail, syntheticRide, syntheticVehicles } from '/replay/synthetic-archive.mjs';
window.fixtureRequests = [];
const params = new URL(location.href).searchParams;
const endpointsOnly = params.has('endpoints');
const overlap = params.has('overlap');
const paged = params.has('paged');
let panel = document.body;
if (params.has('dashboard')) {
  // Lovelace scrolls its panel inside the viewport; the Safari toolbar sits outside it.
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  panel = document.createElement('main');
  panel.style.cssText = 'position:fixed;inset:0;overflow:auto;overscroll-behavior:contain;padding:20px 16px 50vh';
  panel.append(...document.querySelectorAll('body > h1, body > p'));
  document.body.append(panel);
}
if (params.has('native')) {
  class SyntheticMap extends HTMLElement {
    paths = [];
    editableLocations = [];
    scaleRuler = false;
    getView() { return { zoom: 14, center: this.center }; }
    containsLocation() { return false; }
    setView(center, zoom) { this.center = center; this.zoom = zoom; }
    fitBounds(bounds) { this.bounds = bounds; }
  }
  // Exercise lazy loading through the same helper the real dashboard supplies.
  window.loadCardHelpers = async () => ({
    createCardElement({ type }) {
      if (type !== 'map') throw new Error('Unexpected card');
      customElements.define('ha-map', SyntheticMap);
      return document.createElement('hui-map-card');
    },
  });
}
window.fixtureSaved = true;
window.fixtureFeeds = new Set();
const connectionListeners = new Map();
const connection = {
  connected: true,
  addEventListener(type, callback) { if (!connectionListeners.has(type)) connectionListeners.set(type, new Set()); connectionListeners.get(type).add(callback); },
  removeEventListener(type, callback) { connectionListeners.get(type)?.delete(callback); },
  fire(type) { this.connected = type === 'ready'; for (const callback of connectionListeners.get(type) ?? []) callback(); },
  async subscribeMessage(callback, message) {
    fixtureRequests.push(message); fixtureFeeds.add(callback);
    queueMicrotask(() => callback({ schema_version: 1, type: 'baseline', vehicles: message.device_ids.map(device_id => ({ device_id, selection_version: 'a'.repeat(32) + ':1' })) }));
    return () => { fixtureFeeds.delete(callback); };
  },
};
window.fixtureConnectionListeners = connectionListeners;
window.fixtureHass = { user: { id: 'synthetic-reader' }, connection, connected: true, language: 'zh-Hans',
  config: { time_zone: 'Asia/Shanghai',
    components: location.search.includes('native') ? ['map_tiles'] : [] }, states: {}, callWS: async request => {
    window.fixtureRequests.push(request);
    if (request.type === 'config/entity_registry/get') return { device_id: 'synthetic-a' };
    if (window.fixtureDeny) throw { code: 'unauthorized' };
    const data = request.service_data;
    const second = data.device_id === 'synthetic-b';
    const august = data.query_month === '202608' || (!data.query_month &&
      (paged ? second : data.start_date?.startsWith('2026-08')));
    const ride = syntheticRide(data.device_id, { august, sameId: paged, overlap,
      incomplete: params.has('incomplete') });
    if (request.service === 'get_recorded_trips') return { response: { source_mode: 'ride_archive', sort: 'desc', selection_version: 'a'.repeat(32) + ':1',
      rides: [{ ...ride, detail_saved: fixtureSaved }], next_cursor: null, coverage: { missing_months: [], partial_months: ['202609'], unknown_months: [], enumerated_months: ['202609'] } } };
    if (request.service !== 'get_trip_detail') throw new Error('Only history reads are allowed');
    return { response: syntheticDetail(ride, data, { endpointsOnly, overlap }) };
  } };
if (params.has('english')) fixtureHass.language = document.documentElement.lang = 'en';
window.fixtureCard = document.createElement('ninebot-trip-card');
window.fixtureConfig = { type: 'custom:ninebot-trip-card', vehicles: syntheticVehicles,
  start_date: paged ? '2026-08-01' : '2026-09-01', end_date: '2026-09-30', limit: paged ? 1 : 10,
  statistics_entities: ['ninebot:synthetic_day_distance_km'] };
fixtureCard.setConfig(fixtureConfig);
fixtureCard.hass = fixtureHass; panel.append(fixtureCard);
</script></html>
