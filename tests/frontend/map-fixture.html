<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<title>Ninebot synthetic history map fixture</title>
<style>body{margin:20px auto;max-width:850px;padding:0 16px;background:#121b22;color:#eee;font:16px system-ui;--primary-text-color:#eee;--secondary-text-color:#aab7c5;--primary-color:#03a9f4;--divider-color:#40505c;--card-background-color:#18232b;--error-color:#ff5252}ha-card{display:block;border:1px solid #40505c;border-radius:16px}pre{white-space:pre-wrap}</style>
<h1>Synthetic vehicles · offline fixture</h1>
<p>No real account or ride data. Map tiles are disabled.</p>
<script type="module">
import '/ninebot-static/ninebot-trip-card.js';
const row = { ride_id: 'synthetic-ride', detail_id: 'synthetic-detail', query_month: '202609',
  start_time: '2026-09-03T08:00:00Z', end_time: '2026-09-03T08:10:00Z', distance_m: 1200,
  duration_s: 600, duration_h: 1/6, max_speed_m_s: 10, average_speed_m_s: 2, energy_wh: 90,
  precision: { mileages: 1 }, source: 'trip_detail', energy_intensity_wh_per_km: 75 };
window.fixtureRequests = [];
window.fixtureSaved = true;
window.fixtureHass = { user: { id: 'synthetic-reader' }, connection: {}, connected: true, language: 'zh-Hans',
  config: { time_zone: 'Asia/Shanghai' }, states: {}, callWS: async request => {
    window.fixtureRequests.push(request);
    if (request.type === 'config/entity_registry/get') return { device_id: 'synthetic-a' };
    const data = request.service_data;
    if (request.service === 'get_recorded_trips') return { response: { source_mode: 'ride_archive',
      rides: [{ ...row, detail_saved: fixtureSaved }], next_cursor: null, coverage: { missing_months: [], partial_months: ['202609'], unknown_months: [] } } };
    if (request.service !== 'get_trip_detail') throw new Error('Only history reads are allowed');
    const shift = data.device_id === 'synthetic-b' ? 0.002 : 0;
    const all = Array.from({ length: 60 }, (_, sequence) => ({ sequence,
      latitude: 30 + sequence * .0001 + shift, longitude: 120 + Math.sin(sequence / 8) * .001 + shift,
      speed_raw: 25 + Math.sin(sequence / 4) * 12, distance_delta_raw: 40 + Math.cos(sequence / 5) * 9 }));
    return { response: { source_mode: 'ride_archive', query_month: '202609', received_at: row.end_time,
      detail_context: { source_mode: 'ride_archive', archive_revision: 1, scalar_revision: 1, geometry_received_at: row.end_time },
      ride: { ...row, detail_saved: true, track: data.include_track ? all.slice(data.point_offset, data.point_offset + data.max_points) : [],
        track_summary: { total_known: 60, offset: data.point_offset, limit: data.max_points,
          next_offset: null, geometry_kind: 'sampled_unverified' } } } };
  } };
window.fixtureCard = document.createElement('ninebot-trip-card');
fixtureCard.setConfig({ type: 'custom:ninebot-trip-card', vehicles: [
  { device_id: 'synthetic-a', name: 'Synthetic A' }, { device_id: 'synthetic-b', name: 'Synthetic B' }],
  start_date: '2026-09-01', end_date: '2026-09-30', limit: 10,
  statistics_entities: ['ninebot:synthetic_day_distance_km'] });
fixtureCard.hass = fixtureHass; document.body.append(fixtureCard);
</script></html>
