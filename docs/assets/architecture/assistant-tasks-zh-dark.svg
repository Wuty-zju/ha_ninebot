<svg xmlns="http://www.w3.org/2000/svg" width="960" height="888" viewBox="0 0 960 888" role="img" aria-labelledby="title desc" xml:lang="zh-Hans">
<title id="title">查询行程与申请同步</title>
<desc id="desc">原生 Ninebot 工具的两条使用路径</desc>
<style>text {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif}</style>
<rect width="960" height="888" rx="16" fill="#0d1117"/>
<text x="40" y="46" font-size="27" font-weight="700" fill="#e6edf3">查询行程与申请同步</text>
<text x="40" y="77" font-size="16" font-weight="400" fill="#aebdce">原生 Ninebot 工具的两条使用路径</text>
<rect x="40" y="112" width="880" height="137" rx="12" fill="#15263b" stroke="#475569"/>
<text x="64" y="137" font-size="12" font-weight="700" fill="#91bfff">01</text>
<text x="64" y="166" font-size="21" font-weight="650" fill="#e6edf3">选择一辆车</text>
<text x="64" y="197" font-size="17" font-weight="400" fill="#aebdce">Home Assistant 验证调用者身份</text>
<text x="64" y="222" font-size="17" font-weight="400" fill="#aebdce">Ninebot 核对该车的操作权限</text>
<path d="M480 249 V268 H254 V287" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M250 281 L254 287 L258 281" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M480 249 V268 H706 V287" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M702 281 L706 287 L710 281" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="40" y="297" width="428" height="137" rx="12" fill="#142d28" stroke="#475569"/>
<text x="64" y="322" font-size="12" font-weight="700" fill="#91bfff">02 / A</text>
<text x="64" y="351" font-size="21" font-weight="650" fill="#e6edf3">查询统计</text>
<text x="64" y="382" font-size="17" font-weight="400" fill="#aebdce">指定指标和业务周期</text>
<text x="64" y="407" font-size="17" font-weight="400" fill="#aebdce">读取已授权的本地档案</text>
<rect x="492" y="297" width="428" height="137" rx="12" fill="#142d28" stroke="#475569"/>
<text x="516" y="322" font-size="12" font-weight="700" fill="#91bfff">02 / B</text>
<text x="516" y="351" font-size="21" font-weight="650" fill="#e6edf3">预览缺口</text>
<text x="516" y="382" font-size="17" font-weight="400" fill="#aebdce">指定日期并预览缺失详情</text>
<text x="516" y="407" font-size="17" font-weight="400" fill="#aebdce">查看预计请求额度</text>
<path d="M254 434 V453 H254 V472" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M250 466 L254 472 L258 466" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M706 434 V453 H706 V472" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M702 466 L706 472 L710 466" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="40" y="482" width="428" height="137" rx="12" fill="#142d28" stroke="#475569"/>
<text x="64" y="507" font-size="12" font-weight="700" fill="#91bfff">03 / A</text>
<text x="64" y="536" font-size="21" font-weight="650" fill="#e6edf3">核对统计依据</text>
<text x="64" y="567" font-size="17" font-weight="400" fill="#aebdce">返回数值和覆盖情况</text>
<text x="64" y="592" font-size="17" font-weight="400" fill="#aebdce">指标仍未核实时查询帮助</text>
<rect x="492" y="482" width="428" height="137" rx="12" fill="#142d28" stroke="#475569"/>
<text x="516" y="507" font-size="12" font-weight="700" fill="#91bfff">03 / B</text>
<text x="516" y="536" font-size="21" font-weight="650" fill="#e6edf3">提交申请</text>
<text x="516" y="567" font-size="17" font-weight="400" fill="#aebdce">申请权限允许提交本地申请</text>
<text x="516" y="592" font-size="17" font-weight="400" fill="#aebdce">申请人在 HA 面板审核</text>
<path d="M254 619 V638 H254 V657" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M250 651 L254 657 L258 651" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M706 619 V638 H706 V657" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M702 651 L706 657 L710 651" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="40" y="667" width="428" height="137" rx="12" fill="#28203a" stroke="#475569"/>
<text x="64" y="692" font-size="12" font-weight="700" fill="#91bfff">04 / A</text>
<text x="64" y="721" font-size="21" font-weight="650" fill="#e6edf3">显示答案</text>
<text x="64" y="752" font-size="17" font-weight="400" fill="#aebdce">宿主取得本地查询回执</text>
<text x="64" y="777" font-size="17" font-weight="400" fill="#aebdce">引用来源与观测时间</text>
<rect x="492" y="667" width="428" height="137" rx="12" fill="#28203a" stroke="#475569"/>
<text x="516" y="692" font-size="12" font-weight="700" fill="#91bfff">04 / B</text>
<text x="516" y="721" font-size="21" font-weight="650" fill="#e6edf3">核对执行结果</text>
<text x="516" y="752" font-size="17" font-weight="400" fill="#aebdce">调度器按已批准额度执行</text>
<text x="516" y="777" font-size="17" font-weight="400" fill="#aebdce">核对已保存详情和任务进度</text>
<text x="40" y="845" font-size="16" font-weight="400" fill="#aebdce">按车关闭任务申请后，可继续开放获准的本地查询。</text>
</svg>
