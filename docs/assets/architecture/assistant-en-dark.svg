<svg xmlns="http://www.w3.org/2000/svg" width="960" height="913" viewBox="0 0 960 913" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">How Ninebot Assistant answers a question</title>
<desc id="desc">One signed-in user, an authorized vehicle and a traceable source</desc>
<style>text {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif}</style>
<rect width="960" height="913" rx="16" fill="#0d1117"/>
<text x="40" y="46" font-size="27" font-weight="700" fill="#e6edf3">How Ninebot Assistant answers a question</text>
<text x="40" y="77" font-size="16" font-weight="400" fill="#aebdce">One signed-in user, an authorized vehicle and a traceable source</text>
<rect x="40" y="112" width="428" height="137" rx="12" fill="#15263b" stroke="#475569"/>
<text x="64" y="137" font-size="12" font-weight="700" fill="#91bfff">01 / A</text>
<text x="64" y="166" font-size="21" font-weight="650" fill="#e6edf3">Assist or MCP</text>
<text x="64" y="197" font-size="17" font-weight="400" fill="#aebdce">The host selects its model</text>
<text x="64" y="222" font-size="17" font-weight="400" fill="#aebdce">Enable the Ninebot read tools</text>
<rect x="492" y="112" width="428" height="137" rx="12" fill="#15263b" stroke="#475569"/>
<text x="516" y="137" font-size="12" font-weight="700" fill="#91bfff">01 / B</text>
<text x="516" y="166" font-size="21" font-weight="650" fill="#e6edf3">An automation</text>
<text x="516" y="197" font-size="17" font-weight="400" fill="#aebdce">ninebot.ask uses an existing HA AI Task</text>
<text x="516" y="222" font-size="17" font-weight="400" fill="#aebdce">The Action can bind a vehicle</text>
<path d="M254 249 V268 H480 V287" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M476 281 L480 287 L484 281" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M706 249 V268 H480 V287" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M476 281 L480 287 L484 281" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="40" y="297" width="880" height="137" rx="12" fill="#142d28" stroke="#475569"/>
<text x="64" y="322" font-size="12" font-weight="700" fill="#91bfff">02</text>
<text x="64" y="351" font-size="21" font-weight="650" fill="#e6edf3">Home Assistant user context</text>
<text x="64" y="382" font-size="17" font-weight="400" fill="#aebdce">Check administrator, account consent, vehicle selection and ownership</text>
<text x="64" y="407" font-size="17" font-weight="400" fill="#aebdce">Recheck access before returning private results</text>
<path d="M480 434 V453 H254 V472" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M250 466 L254 472 L258 466" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M480 434 V453 H706 V472" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M702 466 L706 472 L710 466" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="40" y="482" width="428" height="162" rx="12" fill="#142d28" stroke="#475569"/>
<text x="64" y="507" font-size="12" font-weight="700" fill="#91bfff">03 / A</text>
<text x="64" y="536" font-size="21" font-weight="650" fill="#e6edf3">Read vehicle data</text>
<text x="64" y="567" font-size="17" font-weight="400" fill="#aebdce">Coordinator snapshots and local SQLite</text>
<text x="64" y="592" font-size="17" font-weight="400" fill="#aebdce">Value, unit, observation time,</text>
<text x="64" y="617" font-size="17" font-weight="400" fill="#aebdce">coverage</text>
<rect x="492" y="482" width="428" height="162" rx="12" fill="#142d28" stroke="#475569"/>
<text x="516" y="507" font-size="12" font-weight="700" fill="#91bfff">03 / B</text>
<text x="516" y="536" font-size="21" font-weight="650" fill="#e6edf3">Retrieve a guide</text>
<text x="516" y="567" font-size="17" font-weight="400" fill="#aebdce">Versioned bilingual help and</text>
<text x="516" y="592" font-size="17" font-weight="400" fill="#aebdce">checklists</text>
<text x="516" y="617" font-size="17" font-weight="400" fill="#aebdce">Excerpt and permanent source link</text>
<path d="M254 644 V663 H480 V682" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M476 676 L480 682 L484 676" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M706 644 V663 H480 V682" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M476 676 L480 682 L484 676" fill="none" stroke="#94a3b8" stroke-width="2"/>
<rect x="40" y="692" width="880" height="137" rx="12" fill="#28203a" stroke="#475569"/>
<text x="64" y="717" font-size="12" font-weight="700" fill="#91bfff">04</text>
<text x="64" y="746" font-size="21" font-weight="650" fill="#e6edf3">Use the result</text>
<text x="64" y="777" font-size="17" font-weight="400" fill="#aebdce">Assist and MCP receive structured tool data</text>
<text x="64" y="802" font-size="17" font-weight="400" fill="#aebdce">The Action can also render a verified answer</text>
<text x="40" y="870" font-size="16" font-weight="400" fill="#aebdce">History task approval uses a separate API and the existing scheduler.</text>
</svg>
