<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Ride synchronization and local reuse</title>
<desc id="desc">Validated pages feed incremental detail acquisition and transactional local storage.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
    'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b4d}
  .title {font-size: 27px; font-weight: 700}
  .label {font-size: 21px; font-weight: 650}
  .body {font-size: 17px; fill: #475569}
  .foot {font-size: 16px; fill: #475569}
  .page {fill: #f8fafc; stroke: #dbe4ef}
  .card {fill: #fff; stroke: #cbd5e1; stroke-width: 1.5}
  .blue {fill: #eff6ff; stroke: #93c5fd}
  .green {fill: #f0fdfa; stroke: #5eead4}
  .purple {fill: #faf5ff; stroke: #d8b4fe}
  .line {fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow)}
</style>
<rect class="page" x="1" y="1" width="878" height="778" rx="20"/>
<text class="title" x="36" y="48">Ride synchronization and local reuse</text>
<rect class="card blue" x="40" y="85" width="380" height="105" rx="12"/>
<text class="label" x="60" y="117">01  Discover and reconcile</text>
<text class="body" x="60" y="145">Initial month scan · recent updates</text>
<text class="body" x="60" y="169">Reuse verified pages · persist checkpoints</text>
<rect class="card blue" x="460" y="85" width="380" height="105" rx="12"/>
<text class="label" x="480" y="117">02  Validate coverage</text>
<text class="body" x="480" y="145">Counts · ride IDs · month membership</text>
<text class="body" x="480" y="169">Repeated or missing pages need repair</text>
<path class="line" d="M 420 137 H 450"/>
<path class="line" d="M 650 190 V 220 H 440 V 240"/>
<rect class="card green" x="40" y="250" width="800" height="85" rx="12"/>
<text class="label" x="60" y="282">03  Fetch only details that need work</text>
<text class="body" x="60" y="310">Reuse stable details · rotate vehicles · share request budget · retry gaps</text>
<path class="line" d="M 440 335 V 370"/>
<rect class="card green" x="40" y="380" width="800" height="110" rx="12"/>
<text class="label" x="60" y="412">04  Commit to the account SQLite archive</text>
<text class="body" x="60" y="440">Normalized rides + compressed sources + page evidence + sync state</text>
<text class="body" x="60" y="464">Keep latest facts and best geometry separately; pause writes at the capacity limit</text>
<path class="line" d="M 240 490 V 530"/>
<path class="line" d="M 640 490 V 530"/>
<rect class="card purple" x="40" y="540" width="380" height="105" rx="12"/>
<text class="label" x="60" y="572">05A  Local reads</text>
<text class="body" x="60" y="600">Response Actions · pages and track chunks</text>
<text class="body" x="60" y="624">Authorized WebSocket · calendar</text>
<rect class="card purple" x="460" y="540" width="380" height="105" rx="12"/>
<text class="label" x="480" y="572">05B  Summaries and trends</text>
<text class="body" x="480" y="600">Month · today · yesterday · latest ride</text>
<text class="body" x="480" y="624">Explicit import to HA long-term statistics</text>
<text class="foot" x="40" y="700">Full trails stay in the archive; entities expose compact current summaries.</text>
<text class="foot" x="40" y="732">Local browsing and cloud acquisition have separate request paths.</text>
</svg>
