<svg xmlns="http://www.w3.org/2000/svg" width="880" height="690" viewBox="0 0 880 690" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Incremental acquisition and local history</title>
<desc id="desc">Discover and validate month pages, deduplicate rides, reuse stable details, fetch missing data within budget and commit the archive before local access.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
    'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b4d}
  .title {font-size: 27px; font-weight: 700}
  .label {font-size: 21px; font-weight: 650}
  .body {font-size: 17px; fill: #475569}
  .foot {font-size: 16px; fill: #475569}
  .page {fill: #f8fafc; stroke: #dbe4ef}
  .card {fill: #fff; stroke: #cbd5e1; stroke-width: 1.5}
  .blue {fill: #eff6ff; stroke: #93c5fd}
  .green {fill: #f0fdfa; stroke: #5eead4}
  .purple {fill: #faf5ff; stroke: #d8b4fe}
  .line {fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow)}
  @media (prefers-color-scheme: dark) {
    text {fill: #e2e8f0}
    .body, .foot {fill: #cbd5e1}
    .page {fill: #111827; stroke: #334155}
    .card {fill: #1e293b; stroke: #475569}
    .blue {fill: #172b49; stroke: #3b82f6}
    .green {fill: #103b3b; stroke: #14b8a6}
    .purple {fill: #322345; stroke: #a78bfa}
  }
</style>
<rect class="page" x="1" y="1" width="878" height="688" rx="20"/>
<text class="title" x="36" y="48">Incremental acquisition and local history</text>
<rect class="card blue" x="40" y="85" width="360" height="105" rx="12"/>
<text class="label" x="60" y="117">Discover months and pages</text>
<text class="body" x="60" y="145">Initial scan · recent updates · gap repair</text>
<text class="body" x="60" y="169">Persist progress and resume after restart</text>
<rect class="card blue" x="480" y="85" width="360" height="105" rx="12"/>
<text class="label" x="500" y="117">Validate lists and ride IDs</text>
<text class="body" x="500" y="145">Counts · deduplication · month membership</text>
<text class="body" x="500" y="169">Retain response and page evidence</text>
<path class="line" d="M 405 137 H 470"/>
<path class="line" d="M 660 195 V 218 H 440 V 236"/>
<rect class="card green" x="40" y="245" width="800" height="85" rx="12"/>
<text class="label" x="60" y="277">Fetch missing, changed or unsettled details</text>
<text class="body" x="60" y="305">Reuse stable details · share the account budget · rotate vehicles · back off on failure</text>
<path class="line" d="M 440 335 V 361"/>
<rect class="card green" x="40" y="370" width="800" height="110" rx="12"/>
<text class="label" x="60" y="402">Transactional private SQLite archive</text>
<text class="body" x="60" y="430">Normalized rides + compressed business originals + receipts, source and capture time</text>
<text class="body" x="60" y="454">Keep latest detail and best track separately; pause writes when the quota is reached.</text>
<path class="line" d="M 230 485 V 521"/>
<path class="line" d="M 650 485 V 521"/>
<rect class="card purple" x="40" y="530" width="380" height="105" rx="12"/>
<text class="label" x="60" y="562">Local queries and track chunks</text>
<text class="body" x="60" y="590">Response Actions · authorized WebSocket</text>
<text class="body" x="60" y="614">Local-only reads do not fetch the cloud</text>
<rect class="card purple" x="460" y="530" width="380" height="105" rx="12"/>
<text class="label" x="480" y="562">HA calendar and statistics</text>
<text class="body" x="480" y="590">Local ride calendar · day/month aggregates</text>
<text class="body" x="480" y="614">Explicit import into Recorder statistics</text>
<text class="foot" x="40" y="665">Full trails stay in the archive; entities expose current summaries.</text>
</svg>
