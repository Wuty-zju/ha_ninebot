<svg xmlns="http://www.w3.org/2000/svg" width="880" height="635" viewBox="0 0 880 635" role="img" aria-labelledby="title desc" xml:lang="zh-Hans">
<title id="title">控制指令与状态确认</title>
<desc id="desc">一次发送，十五秒内确认；座桶解锁显示保持五秒并有界观察锁舌。</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
    'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b4d}
  .title {font-size: 27px; font-weight: 700}
  .label {font-size: 21px; font-weight: 650}
  .body {font-size: 17px; fill: #475569}
  .foot {font-size: 16px; fill: #475569}
  .page {fill: #f8fafc; stroke: #dbe4ef}
  .card {fill: #fff; stroke: #cbd5e1; stroke-width: 1.5}
  .blue {fill: #eff6ff; stroke: #93c5fd}
  .green {fill: #f0fdfa; stroke: #5eead4}
  .purple {fill: #faf5ff; stroke: #d8b4fe}
  .line {fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow)}
</style>
<rect class="page" x="1" y="1" width="878" height="633" rx="20"/>
<text class="title" x="36" y="48">控制指令与状态确认</text>
<rect class="card blue" x="40" y="85" width="380" height="105" rx="12"/>
<text class="label" x="60" y="117">01  控制请求</text>
<text class="body" x="60" y="145">Lock 实体与按钮共用执行器</text>
<text class="body" x="60" y="169">开关 · 车辆许可 · 归属与权限</text>
<rect class="card blue" x="460" y="85" width="380" height="105" rx="12"/>
<text class="label" x="480" y="117">02  发送一次</text>
<text class="body" x="480" y="145">车辆／云端判断执行条件</text>
<text class="body" x="480" y="169">新指令可替换旧确认观察</text>
<path class="line" d="M 420 137 H 450"/>
<path class="line" d="M 650 190 V 220 H 440 V 240"/>
<rect class="card green" x="40" y="250" width="800" height="110" rx="12"/>
<text class="label" x="60" y="282">03  最多十五秒加速回读</text>
<text class="body" x="60" y="310">新状态一经确认立即显示 · 不自动重发控制指令</text>
<text class="body" x="60" y="334">分别记录接受、未确认与失败</text>
<path class="line" d="M 240 360 V 400"/>
<path class="line" d="M 640 360 V 400"/>
<rect class="card purple" x="40" y="410" width="380" height="105" rx="12"/>
<text class="label" x="60" y="442">04A  车辆锁</text>
<text class="body" x="60" y="470">上锁＝远程关闭；解锁＝远程开启</text>
<text class="body" x="60" y="494">短期跟随自动回锁</text>
<rect class="card purple" x="460" y="410" width="380" height="105" rx="12"/>
<text class="label" x="480" y="442">04B  座桶锁</text>
<text class="body" x="480" y="470">确认解锁后显示至少五秒</text>
<text class="body" x="480" y="494">锁舌最多观察六十秒；本地上锁</text>
<text class="foot" x="40" y="565">锁舌上报与座桶盖是否打开是两种不同信息。</text>
<text class="foot" x="40" y="597">读取异常、新指令或卸载会结束对应的后续观察。</text>
</svg>
