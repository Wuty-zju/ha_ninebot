<svg xmlns="http://www.w3.org/2000/svg" width="960" height="888" viewBox="0 0 960 888" role="img" aria-labelledby="title desc" xml:lang="zh-Hans">
<title id="title">从一个问题找到它的依据</title>
<desc id="desc">宿主选择模型 · HA 用户身份 · 逐车授权</desc>
<style>text {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif}</style>
<rect width="960" height="888" rx="16" fill="#ffffff"/>
<text x="40" y="46" font-size="27" font-weight="700" fill="#182536">从一个问题找到它的依据</text>
<text x="40" y="77" font-size="16" font-weight="400" fill="#475569">宿主选择模型 · HA 用户身份 · 逐车授权</text>
<rect x="40" y="112" width="428" height="137" rx="12" fill="#edf5ff" stroke="#cbd5e1"/>
<text x="64" y="137" font-size="12" font-weight="700" fill="#245da8">01 / A</text>
<text x="64" y="166" font-size="21" font-weight="650" fill="#182536">对话或 MCP</text>
<text x="64" y="197" font-size="17" font-weight="400" fill="#475569">Assist 对话代理或外部客户端</text>
<text x="64" y="222" font-size="17" font-weight="400" fill="#475569">选择 Ninebot 工具集</text>
<rect x="492" y="112" width="428" height="137" rx="12" fill="#edf5ff" stroke="#cbd5e1"/>
<text x="516" y="137" font-size="12" font-weight="700" fill="#245da8">01 / B</text>
<text x="516" y="166" font-size="21" font-weight="650" fill="#182536">自动化</text>
<text x="516" y="197" font-size="17" font-weight="400" fill="#475569">通过 HA AI Task 调用 ninebot.ask</text>
<text x="516" y="222" font-size="17" font-weight="400" fill="#475569">绑定所选车辆与本轮业务日期</text>
<path d="M254 249 V268 H480 V287" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M476 281 L480 287 L484 281" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M706 249 V268 H480 V287" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M476 281 L480 287 L484 281" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="40" y="297" width="880" height="137" rx="12" fill="#edf9f4" stroke="#cbd5e1"/>
<text x="64" y="322" font-size="12" font-weight="700" fill="#245da8">02</text>
<text x="64" y="351" font-size="21" font-weight="650" fill="#182536">Home Assistant 用户与车辆</text>
<text x="64" y="382" font-size="17" font-weight="400" fill="#475569">核对所选设备、账号归属及本次操作权限</text>
<text x="64" y="407" font-size="17" font-weight="400" fill="#475569">交付结果前再次校验原用户权限</text>
<path d="M480 434 V453 H254 V472" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M250 466 L254 472 L258 466" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M480 434 V453 H706 V472" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M702 466 L706 472 L710 466" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="40" y="482" width="428" height="137" rx="12" fill="#edf9f4" stroke="#cbd5e1"/>
<text x="64" y="507" font-size="12" font-weight="700" fill="#245da8">03 / A</text>
<text x="64" y="536" font-size="21" font-weight="650" fill="#182536">核对读数</text>
<text x="64" y="567" font-size="17" font-weight="400" fill="#475569">读缓存状态或一项档案指标</text>
<text x="64" y="592" font-size="17" font-weight="400" fill="#475569">保留周期、单位与观测时间</text>
<rect x="492" y="482" width="428" height="137" rx="12" fill="#edf9f4" stroke="#cbd5e1"/>
<text x="516" y="507" font-size="12" font-weight="700" fill="#245da8">03 / B</text>
<text x="516" y="536" font-size="21" font-weight="650" fill="#182536">解释依据</text>
<text x="516" y="567" font-size="17" font-weight="400" fill="#475569">引用指南与有界排查清单</text>
<text x="516" y="592" font-size="17" font-weight="400" fill="#475569">逐车获准后读取同步状态</text>
<path d="M254 619 V638 H480 V657" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M476 651 L480 657 L484 651" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M706 619 V638 H480 V657" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M476 651 L480 657 L484 651" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="40" y="667" width="880" height="137" rx="12" fill="#f5f1fc" stroke="#cbd5e1"/>
<text x="64" y="692" font-size="12" font-weight="700" fill="#245da8">04</text>
<text x="64" y="721" font-size="21" font-weight="650" fill="#182536">将证据交还宿主</text>
<text x="64" y="752" font-size="17" font-weight="400" fill="#475569">覆盖完整的已结束周期可一次读完</text>
<text x="64" y="777" font-size="17" font-weight="400" fill="#475569">待核的问题保留覆盖情况与来源</text>
<text x="40" y="845" font-size="16" font-weight="400" fill="#475569">历史任务单独逐车授权，由申请人在 HA 中确认执行。</text>
</svg>
