<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Live updates and historical acquisition</title>
<desc id="desc">Account-isolated sessions share bounded scheduling across live and historical work.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
    'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b4d}
  .title {font-size: 27px; font-weight: 700}
  .label {font-size: 21px; font-weight: 650}
  .body {font-size: 17px; fill: #475569}
  .foot {font-size: 16px; fill: #475569}
  .page {fill: #f8fafc; stroke: #dbe4ef}
  .card {fill: #fff; stroke: #cbd5e1; stroke-width: 1.5}
  .blue {fill: #eff6ff; stroke: #93c5fd}
  .green {fill: #f0fdfa; stroke: #5eead4}
  .purple {fill: #faf5ff; stroke: #d8b4fe}
  .line {fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow)}
</style>
<rect class="page" x="1" y="1" width="878" height="698" rx="20"/>
<text class="title" x="36" y="48">Live updates and historical acquisition</text>
<rect class="card blue" x="40" y="85" width="800" height="85" rx="12"/>
<text class="label" x="60" y="117">01  Ninebot cloud</text>
<text class="body" x="60" y="145">Vehicles · status · battery · ride lists and details</text>
<path class="line" d="M 440 170 V 205" marker-start="url(#arrow)"/>
<rect class="card blue" x="40" y="215" width="800" height="85" rx="12"/>
<text class="label" x="60" y="247">02  Account and request coordination</text>
<text class="body" x="60" y="275">Isolated sessions · shared reads · bounded concurrency and backoff</text>
<path class="line" d="M 240 300 V 335"/>
<path class="line" d="M 640 300 V 335"/>
<rect class="card blue" x="40" y="345" width="380" height="105" rx="12"/>
<text class="label" x="60" y="377">03A  Realtime updates</text>
<text class="body" x="60" y="405">Per-vehicle and per-group scheduling</text>
<text class="body" x="60" y="429">Demand · response age · partial recovery</text>
<rect class="card green" x="460" y="345" width="380" height="105" rx="12"/>
<text class="label" x="480" y="377">03B  History acquisition</text>
<text class="body" x="480" y="405">Month pages · missing details · updates</text>
<text class="body" x="480" y="429">Account budget · checkpoints · validation</text>
<path class="line" d="M 230 450 V 485"/>
<path class="line" d="M 650 450 V 485"/>
<rect class="card purple" x="40" y="495" width="380" height="105" rx="12"/>
<text class="label" x="60" y="527">04A  Current state</text>
<text class="body" x="60" y="555">Entities · location · state events</text>
<text class="body" x="60" y="579">Native HA automations and device pages</text>
<rect class="card green" x="460" y="495" width="380" height="105" rx="12"/>
<text class="label" x="480" y="527">04B  Local account archive</text>
<text class="body" x="480" y="555">SQLite · source evidence · best track</text>
<text class="body" x="480" y="579">Query Actions · calendar · statistics import</text>
<text class="foot" x="40" y="650">Entities share reads. Browsing saved history uses the local archive.</text>
</svg>
