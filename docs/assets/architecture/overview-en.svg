<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Account isolation and data flow</title>
<desc id="desc">An account adapter feeds separate realtime and historical paths. Sessions and archives belong to each account.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
    'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b4d}
  .title {font-size: 27px; font-weight: 700}
  .label {font-size: 21px; font-weight: 650}
  .body {font-size: 17px; fill: #475569}
  .foot {font-size: 16px; fill: #475569}
  .page {fill: #f8fafc; stroke: #dbe4ef}
  .card {fill: #fff; stroke: #cbd5e1; stroke-width: 1.5}
  .blue {fill: #eff6ff; stroke: #93c5fd}
  .green {fill: #f0fdfa; stroke: #5eead4}
  .purple {fill: #faf5ff; stroke: #d8b4fe}
  .line {fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow)}
  @media (prefers-color-scheme: dark) {
    text {fill: #e2e8f0}
    .body, .foot {fill: #cbd5e1}
    .page {fill: #111827; stroke: #334155}
    .card {fill: #1e293b; stroke: #475569}
    .blue {fill: #172b49; stroke: #3b82f6}
    .green {fill: #103b3b; stroke: #14b8a6}
    .purple {fill: #322345; stroke: #a78bfa}
  }
</style>
<rect class="page" x="1" y="1" width="878" height="638" rx="20"/>
<text class="title" x="36" y="48">Account isolation and data flow</text>
<rect class="card blue" x="40" y="85" width="220" height="85" rx="12"/>
<text class="label" x="60" y="117">Ninebot cloud</text>
<text class="body" x="60" y="145">Vehicle and ride data</text>
<rect class="card blue" x="320" y="85" width="520" height="105" rx="12"/>
<text class="label" x="340" y="117">Account session and cloud adapter</text>
<text class="body" x="340" y="145">Managed local API · history-specific pagination</text>
<text class="body" x="340" y="169">Account isolation · shared request scheduling</text>
<path class="line" d="M 270 127 H 310" marker-start="url(#arrow)"/>
<path class="line" d="M 580 195 V 221"/>
<rect class="card card" x="40" y="230" width="800" height="85" rx="12"/>
<text class="label" x="60" y="262">Source evidence and normalized models</text>
<text class="body" x="60" y="290">Keep source, receipt time and precision; separate reported, calculated and missing values.</text>
<path class="line" d="M 240 320 V 346"/>
<path class="line" d="M 640 320 V 346"/>
<rect class="card blue" x="40" y="355" width="380" height="105" rx="12"/>
<text class="label" x="60" y="387">Realtime coordinator</text>
<text class="body" x="60" y="415">Status · battery · current month</text>
<text class="body" x="60" y="439">Demand · freshness · backoff</text>
<rect class="card green" x="460" y="355" width="380" height="105" rx="12"/>
<text class="label" x="480" y="387">Historical acquisition</text>
<text class="body" x="480" y="415">Months · rides · details · tracks</text>
<text class="body" x="480" y="439">Checkpoints · incremental work · budget</text>
<path class="line" d="M 230 465 V 491"/>
<path class="line" d="M 650 465 V 491"/>
<rect class="card blue" x="40" y="500" width="380" height="105" rx="12"/>
<text class="label" x="60" y="532">Home Assistant entities</text>
<text class="body" x="60" y="560">Sensors · locks · tracker · images · events</text>
<text class="body" x="60" y="584">Current state and automations</text>
<rect class="card green" x="460" y="500" width="380" height="105" rx="12"/>
<text class="label" x="480" y="532">Private account archive</text>
<text class="body" x="480" y="560">SQLite · business evidence · ride models</text>
<text class="body" x="480" y="584">Local queries · calendar · aggregates</text>
</svg>
