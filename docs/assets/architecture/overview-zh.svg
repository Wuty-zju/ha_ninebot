<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-labelledby="title desc" xml:lang="zh-Hans">
<title id="title">账号隔离与数据分层</title>
<desc id="desc">云端适配分为实时更新和历史采集；各账号独立保存会话与档案。</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
    'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b4d}
  .title {font-size: 27px; font-weight: 700}
  .label {font-size: 21px; font-weight: 650}
  .body {font-size: 17px; fill: #475569}
  .foot {font-size: 16px; fill: #475569}
  .page {fill: #f8fafc; stroke: #dbe4ef}
  .card {fill: #fff; stroke: #cbd5e1; stroke-width: 1.5}
  .blue {fill: #eff6ff; stroke: #93c5fd}
  .green {fill: #f0fdfa; stroke: #5eead4}
  .purple {fill: #faf5ff; stroke: #d8b4fe}
  .line {fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow)}
  @media (prefers-color-scheme: dark) {
    text {fill: #e2e8f0}
    .body, .foot {fill: #cbd5e1}
    .page {fill: #111827; stroke: #334155}
    .card {fill: #1e293b; stroke: #475569}
    .blue {fill: #172b49; stroke: #3b82f6}
    .green {fill: #103b3b; stroke: #14b8a6}
    .purple {fill: #322345; stroke: #a78bfa}
  }
</style>
<rect class="page" x="1" y="1" width="878" height="638" rx="20"/>
<text class="title" x="36" y="48">账号隔离与数据分层</text>
<rect class="card blue" x="40" y="85" width="220" height="85" rx="12"/>
<text class="label" x="60" y="117">九号云服务</text>
<text class="body" x="60" y="145">车辆与行程数据</text>
<rect class="card blue" x="320" y="85" width="520" height="105" rx="12"/>
<text class="label" x="340" y="117">账号会话与云端适配</text>
<text class="body" x="340" y="145">受管理本地 API · 历史专用分页</text>
<text class="body" x="340" y="169">逐账号隔离 · 共享请求调度</text>
<path class="line" d="M 270 127 H 310" marker-start="url(#arrow)"/>
<path class="line" d="M 580 195 V 221"/>
<rect class="card card" x="40" y="230" width="800" height="85" rx="12"/>
<text class="label" x="60" y="262">原始数据与规范化模型</text>
<text class="body" x="60" y="290">保留来源、采集时间与精度；区分原值、计算值及缺报</text>
<path class="line" d="M 240 320 V 346"/>
<path class="line" d="M 640 320 V 346"/>
<rect class="card blue" x="40" y="355" width="380" height="105" rx="12"/>
<text class="label" x="60" y="387">实时协调器</text>
<text class="body" x="60" y="415">状态 · 电池 · 当前月份</text>
<text class="body" x="60" y="439">需求 · 新鲜度 · 退避</text>
<rect class="card green" x="460" y="355" width="380" height="105" rx="12"/>
<text class="label" x="480" y="387">历史采集任务</text>
<text class="body" x="480" y="415">月份 · 行程 · 详情 · 轨迹</text>
<text class="body" x="480" y="439">断点 · 增量 · 请求预算</text>
<path class="line" d="M 230 465 V 491"/>
<path class="line" d="M 650 465 V 491"/>
<rect class="card blue" x="40" y="500" width="380" height="105" rx="12"/>
<text class="label" x="60" y="532">Home Assistant 实体</text>
<text class="body" x="60" y="560">传感器 · 锁 · 定位 · 图片 · 事件</text>
<text class="body" x="60" y="584">当前状态与自动化</text>
<rect class="card green" x="460" y="500" width="380" height="105" rx="12"/>
<text class="label" x="480" y="532">账号私有档案</text>
<text class="body" x="480" y="560">SQLite · 原始业务响应 · 行程模型</text>
<text class="body" x="480" y="584">本地查询 · 日历 · 聚合统计</text>
</svg>
