<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Commands and observed state</title>
<desc id="desc">Explicitly enabled, allowlisted commands are sent once, followed by bounded status checks. State follows cloud observations; seat locking is manual.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
    'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b4d}
  .title {font-size: 27px; font-weight: 700}
  .label {font-size: 21px; font-weight: 650}
  .body {font-size: 17px; fill: #475569}
  .foot {font-size: 16px; fill: #475569}
  .page {fill: #f8fafc; stroke: #dbe4ef}
  .card {fill: #fff; stroke: #cbd5e1; stroke-width: 1.5}
  .blue {fill: #eff6ff; stroke: #93c5fd}
  .green {fill: #f0fdfa; stroke: #5eead4}
  .purple {fill: #faf5ff; stroke: #d8b4fe}
  .line {fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow)}
  @media (prefers-color-scheme: dark) {
    text {fill: #e2e8f0}
    .body, .foot {fill: #cbd5e1}
    .page {fill: #111827; stroke: #334155}
    .card {fill: #1e293b; stroke: #475569}
    .blue {fill: #172b49; stroke: #3b82f6}
    .green {fill: #103b3b; stroke: #14b8a6}
    .purple {fill: #322345; stroke: #a78bfa}
  }
</style>
<rect class="page" x="1" y="1" width="878" height="468" rx="20"/>
<text class="title" x="36" y="48">Commands and observed state</text>
<rect class="card blue" x="40" y="85" width="240" height="105" rx="12"/>
<text class="label" x="60" y="117">Explicit opt-in</text>
<text class="body" x="60" y="145">Vehicle allowlist</text>
<text class="body" x="60" y="169">Ownership and access</text>
<rect class="card blue" x="320" y="85" width="240" height="105" rx="12"/>
<text class="label" x="340" y="117">Send one command</text>
<text class="body" x="340" y="145">Locks and buttons share</text>
<text class="body" x="340" y="169">one command executor</text>
<rect class="card blue" x="600" y="85" width="240" height="105" rx="12"/>
<text class="label" x="620" y="117">Vehicle and cloud</text>
<text class="body" x="620" y="145">Apply operating rules</text>
<text class="body" x="620" y="169">Accept or reject request</text>
<path class="line" d="M 285 137 H 310"/>
<path class="line" d="M 565 137 H 590"/>
<path class="line" d="M 720 195 V 218 H 440 V 241"/>
<rect class="card green" x="40" y="250" width="800" height="110" rx="12"/>
<text class="label" x="60" y="282">Temporarily increase status checks</text>
<text class="body" x="60" y="310">Check the target at about 0 / 2 / 5 seconds; briefly follow automatic relocking.</text>
<text class="body" x="60" y="334">Update entities from fresh observations; follow-up ends within about 30 seconds.</text>
<text class="foot" x="40" y="404">Vehicle lock: remote start / stop. Seat lock: remote open, manual close.</text>
<text class="foot" x="40" y="435">Command acceptance and observed target state are recorded separately.</text>
</svg>
