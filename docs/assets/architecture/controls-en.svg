<svg xmlns="http://www.w3.org/2000/svg" width="960" height="727" viewBox="0 0 960 727" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Commands and observed state</title>
<desc id="desc">Shared executor · immediate confirmed updates · bounded follow-up</desc>
<style>text {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif}</style>
<rect width="960" height="727" rx="16" fill="#ffffff"/>
<text x="40" y="46" font-size="27" font-weight="700" fill="#182536">Commands and observed state</text>
<text x="40" y="77" font-size="16" font-weight="400" fill="#475569">Shared executor · immediate confirmed updates · bounded follow-up</text>
<rect x="40" y="112" width="880" height="137" rx="12" fill="#edf5ff" stroke="#cbd5e1"/>
<text x="64" y="137" font-size="12" font-weight="700" fill="#245da8">01</text>
<text x="64" y="166" font-size="21" font-weight="650" fill="#182536">Authorize and send once</text>
<text x="64" y="197" font-size="17" font-weight="400" fill="#475569">Locks and buttons share enablement, allowlist and access checks</text>
<text x="64" y="222" font-size="17" font-weight="400" fill="#475569">A new command can replace an older confirmation observer</text>
<path d="M480 249 V268 H480 V287" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M476 281 L480 287 L484 281" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="40" y="297" width="880" height="137" rx="12" fill="#edf9f4" stroke="#cbd5e1"/>
<text x="64" y="322" font-size="12" font-weight="700" fill="#245da8">02</text>
<text x="64" y="351" font-size="21" font-weight="650" fill="#182536">Accelerated status readback</text>
<text x="64" y="382" font-size="17" font-weight="400" fill="#475569">Up to 15 seconds; publish the observed transition immediately</text>
<text x="64" y="407" font-size="17" font-weight="400" fill="#475569">Distinguish acceptance, unconfirmed outcome and failure</text>
<path d="M480 434 V453 H254 V472" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M250 466 L254 472 L258 466" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M480 434 V453 H706 V472" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M702 466 L706 472 L710 466" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="40" y="482" width="428" height="137" rx="12" fill="#f5f1fc" stroke="#cbd5e1"/>
<text x="64" y="507" font-size="12" font-weight="700" fill="#245da8">03 / A</text>
<text x="64" y="536" font-size="21" font-weight="650" fill="#182536">Vehicle lock</text>
<text x="64" y="567" font-size="17" font-weight="400" fill="#475569">Remote stop locks; remote start unlocks</text>
<text x="64" y="592" font-size="17" font-weight="400" fill="#475569">Briefly follow automatic relocking</text>
<rect x="492" y="482" width="428" height="137" rx="12" fill="#f5f1fc" stroke="#cbd5e1"/>
<text x="516" y="507" font-size="12" font-weight="700" fill="#245da8">03 / B</text>
<text x="516" y="536" font-size="21" font-weight="650" fill="#182536">Seat lock</text>
<text x="516" y="567" font-size="17" font-weight="400" fill="#475569">Verified unlock display held for 5 s</text>
<text x="516" y="592" font-size="17" font-weight="400" fill="#475569">Observe latch up to 60 s; close locally</text>
<text x="40" y="660" font-size="16" font-weight="400" fill="#475569">Latch position does not establish lid position. Control commands are never replayed</text>
<text x="40" y="684" font-size="16" font-weight="400" fill="#475569">automatically.</text>
</svg>
