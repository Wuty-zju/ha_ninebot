<svg xmlns="http://www.w3.org/2000/svg" width="880" height="635" viewBox="0 0 880 635" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Commands and state confirmation</title>
<desc id="desc">One command, a 15-second confirmation window and bounded seat-latch observation.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
    'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b4d}
  .title {font-size: 27px; font-weight: 700}
  .label {font-size: 21px; font-weight: 650}
  .body {font-size: 17px; fill: #475569}
  .foot {font-size: 16px; fill: #475569}
  .page {fill: #f8fafc; stroke: #dbe4ef}
  .card {fill: #fff; stroke: #cbd5e1; stroke-width: 1.5}
  .blue {fill: #eff6ff; stroke: #93c5fd}
  .green {fill: #f0fdfa; stroke: #5eead4}
  .purple {fill: #faf5ff; stroke: #d8b4fe}
  .line {fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow)}
</style>
<rect class="page" x="1" y="1" width="878" height="633" rx="20"/>
<text class="title" x="36" y="48">Commands and state confirmation</text>
<rect class="card blue" x="40" y="85" width="380" height="105" rx="12"/>
<text class="label" x="60" y="117">01  Control request</text>
<text class="body" x="60" y="145">Locks and buttons share one executor</text>
<text class="body" x="60" y="169">Enablement · allowlist · ownership/access</text>
<rect class="card blue" x="460" y="85" width="380" height="105" rx="12"/>
<text class="label" x="480" y="117">02  Send once</text>
<text class="body" x="480" y="145">Vehicle/cloud applies operating rules</text>
<text class="body" x="480" y="169">New commands replace older observers</text>
<path class="line" d="M 420 137 H 450"/>
<path class="line" d="M 650 190 V 220 H 440 V 240"/>
<rect class="card green" x="40" y="250" width="800" height="110" rx="12"/>
<text class="label" x="60" y="282">03  Accelerated readback for up to 15 seconds</text>
<text class="body" x="60" y="310">Publish the confirmed transition immediately · no automatic command replay</text>
<text class="body" x="60" y="334">Keep acceptance, unconfirmed outcome and failure distinct</text>
<path class="line" d="M 240 360 V 400"/>
<path class="line" d="M 640 360 V 400"/>
<rect class="card purple" x="40" y="410" width="380" height="105" rx="12"/>
<text class="label" x="60" y="442">04A  Vehicle lock</text>
<text class="body" x="60" y="470">Lock = remote stop; unlock = remote start</text>
<text class="body" x="60" y="494">Brief follow-up observes auto-relocking</text>
<rect class="card purple" x="460" y="410" width="380" height="105" rx="12"/>
<text class="label" x="480" y="442">04B  Seat lock</text>
<text class="body" x="480" y="470">Hold a verified unlock display for 5 seconds</text>
<text class="body" x="480" y="494">Observe latch up to 60 seconds; close locally</text>
<text class="foot" x="40" y="565">A latch report does not establish whether the compartment lid is open.</text>
<text class="foot" x="40" y="597">Read errors, replacement commands or unloading end the corresponding observer.</text>
</svg>
