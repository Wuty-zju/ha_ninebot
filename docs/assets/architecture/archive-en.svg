<svg xmlns="http://www.w3.org/2000/svg" width="880" height="720" viewBox="0 0 880 720" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Account archive lifecycle</title>
<desc id="desc">One account archive across entry removal, upgrades and transfers.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
    'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b4d}
  .title {font-size: 27px; font-weight: 700}
  .label {font-size: 21px; font-weight: 650}
  .body {font-size: 17px; fill: #475569}
  .foot {font-size: 16px; fill: #475569}
  .page {fill: #f8fafc; stroke: #dbe4ef}
  .card {fill: #fff; stroke: #cbd5e1; stroke-width: 1.5}
  .blue {fill: #eff6ff; stroke: #93c5fd}
  .green {fill: #f0fdfa; stroke: #5eead4}
  .purple {fill: #faf5ff; stroke: #d8b4fe}
  .line {fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow)}
</style>
<rect class="page" x="1" y="1" width="878" height="718" rx="20"/>
<text class="title" x="36" y="48">Account archive lifecycle</text>
<rect class="card blue" x="40" y="85" width="380" height="105" rx="12"/>
<text class="label" x="60" y="117">Authenticated account</text>
<text class="body" x="60" y="145">Stable account identity · multiple vehicles</text>
<text class="body" x="60" y="169">Reconnect after removal and sign-in</text>
<rect class="card blue" x="460" y="85" width="380" height="105" rx="12"/>
<text class="label" x="480" y="117">Legacy and imported sources</text>
<text class="body" x="480" y="145">Isolated upgrade · owner/hash/link checks</text>
<text class="body" x="480" y="169">Merge, then remove verified source copies</text>
<path class="line" d="M 230 190 V 220 H 330 V 250"/>
<path class="line" d="M 650 190 V 220 H 550 V 250"/>
<rect class="card green" x="40" y="260" width="800" height="110" rx="12"/>
<text class="label" x="60" y="292">One private SQLite database per account</text>
<text class="body" x="60" y="320">Rides · latest details · best geometry · compressed evidence · checkpoints</text>
<text class="body" x="60" y="344">Serialized database worker · transactions · capacity limit · local verification</text>
<path class="line" d="M 230 370 V 415"/>
<path class="line" d="M 650 370 V 415"/>
<rect class="card purple" x="40" y="425" width="380" height="105" rx="12"/>
<text class="label" x="60" y="457">Remove an account</text>
<text class="body" x="60" y="485">Retain by default; reuse on same-account login</text>
<text class="body" x="60" y="509">Opt out to delete managed account history</text>
<rect class="card purple" x="460" y="425" width="380" height="105" rx="12"/>
<text class="label" x="480" y="457">Export and restore</text>
<text class="body" x="480" y="485">Consistent snapshots by account/vehicle</text>
<text class="body" x="480" y="509">ZIP + SHA256 manifest · validated merge</text>
<text class="foot" x="40" y="590">Failed sources stay for review. Saved records have no age-based expiry.</text>
<text class="foot" x="40" y="624">Account archives, sign-in sessions and HA Recorder have separate lifecycles.</text>
<text class="foot" x="40" y="658">Back up HA before upgrading; use exports for migration between installations.</text>
</svg>
