<svg xmlns="http://www.w3.org/2000/svg" width="880" height="690" viewBox="0 0 880 690" role="img" aria-labelledby="title desc" xml:lang="zh-Hans">
<title id="title">增量采集、归档与本地读取</title>
<desc id="desc">按月发现与分页校验后去重，复用稳定详情，按预算补取，事务保存，再通过本地接口读取。</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
    <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans',
    'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #172b4d}
  .title {font-size: 27px; font-weight: 700}
  .label {font-size: 21px; font-weight: 650}
  .body {font-size: 17px; fill: #475569}
  .foot {font-size: 16px; fill: #475569}
  .page {fill: #f8fafc; stroke: #dbe4ef}
  .card {fill: #fff; stroke: #cbd5e1; stroke-width: 1.5}
  .blue {fill: #eff6ff; stroke: #93c5fd}
  .green {fill: #f0fdfa; stroke: #5eead4}
  .purple {fill: #faf5ff; stroke: #d8b4fe}
  .line {fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow)}
  @media (prefers-color-scheme: dark) {
    text {fill: #e2e8f0}
    .body, .foot {fill: #cbd5e1}
    .page {fill: #111827; stroke: #334155}
    .card {fill: #1e293b; stroke: #475569}
    .blue {fill: #172b49; stroke: #3b82f6}
    .green {fill: #103b3b; stroke: #14b8a6}
    .purple {fill: #322345; stroke: #a78bfa}
  }
</style>
<rect class="page" x="1" y="1" width="878" height="688" rx="20"/>
<text class="title" x="36" y="48">增量采集、归档与本地读取</text>
<rect class="card blue" x="40" y="85" width="360" height="105" rx="12"/>
<text class="label" x="60" y="117">发现月份与分页</text>
<text class="body" x="60" y="145">首次扫描 · 近期增量 · 缺口补扫</text>
<text class="body" x="60" y="169">保存进度，重启后续接</text>
<rect class="card blue" x="480" y="85" width="360" height="105" rx="12"/>
<text class="label" x="500" y="117">校验列表与行程 ID</text>
<text class="body" x="500" y="145">数量 · 去重 · 月份关系 · 覆盖</text>
<text class="body" x="500" y="169">保留响应与分页依据</text>
<path class="line" d="M 405 137 H 470"/>
<path class="line" d="M 660 195 V 218 H 440 V 236"/>
<rect class="card green" x="40" y="245" width="800" height="85" rx="12"/>
<text class="label" x="60" y="277">只补取缺失、变化或尚未稳定的详情</text>
<text class="body" x="60" y="305">复用稳定详情；共享账号预算；多车轮转；失败退避</text>
<path class="line" d="M 440 335 V 361"/>
<rect class="card green" x="40" y="370" width="800" height="110" rx="12"/>
<text class="label" x="60" y="402">事务化私有 SQLite 档案</text>
<text class="body" x="60" y="430">规范化行程 + 压缩原始响应 + 收据、来源及采集时间</text>
<text class="body" x="60" y="454">分别保存最新详情与较好轨迹；容量达到上限时暂停写入</text>
<path class="line" d="M 230 485 V 521"/>
<path class="line" d="M 650 485 V 521"/>
<rect class="card purple" x="40" y="530" width="380" height="105" rx="12"/>
<text class="label" x="60" y="562">本地查询与轨迹分段</text>
<text class="body" x="60" y="590">响应型 Actions · 授权 WebSocket</text>
<text class="body" x="60" y="614">读取本地档案，不触发云端补抓</text>
<rect class="card purple" x="460" y="530" width="380" height="105" rx="12"/>
<text class="label" x="480" y="562">HA 日历与长期统计</text>
<text class="body" x="480" y="590">本地行程日历 · 按日/月聚合</text>
<text class="body" x="480" y="614">显式导入 Recorder 统计</text>
<text class="foot" x="40" y="665">完整轨迹保留在档案中；实体只显示当前摘要。</text>
</svg>
