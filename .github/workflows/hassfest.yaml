name: Hassfest
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hassfest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Hassfest validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3
