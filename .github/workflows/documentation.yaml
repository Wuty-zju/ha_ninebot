name: Documentation
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check documentation contracts and theme contrast
        run: python -m unittest discover -s scripts/tests -p 'test_docs.py'
      - name: Check public links, language outlines and assets
        run: python scripts/check_docs.py
      - name: Verify reproducible bilingual light/dark diagrams
        run: python scripts/render_architecture.py --check
