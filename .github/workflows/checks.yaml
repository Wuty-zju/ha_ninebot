name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.16.10
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - name: Check offline agent navigation and evidence references
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/agent_context.py --check
  test:
    # Full compatibility runs are requested for major updates, not every beta.
    # A maintainer can dispatch this workflow on the branch/main being released.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            test-plugin: '0.13.305'
            ha: '2026.1.0'
          - python: '3.14'
            test-plugin: '0.13.367'
            ha: '2026.9.4'
          - python: '3.14'
            test-plugin: '0.13.368'
            ha: '2026.10.0b0'
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated test dependencies
        run: >-
          python -m pip install
          pytest-homeassistant-custom-component==${{ matrix.test-plugin }}
          ninecli==0.1.7 ruff==0.16.10 mypy==2.4.0
      - name: Verify the pinned Home Assistant test environment
        env:
          EXPECTED_HA: ${{ matrix.ha }}
        run: >-
          python -c 'import os; from importlib.metadata import version;
          assert version("homeassistant") == os.environ["EXPECTED_HA"]'
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: mypy custom_components/ninebot --follow-imports=silent
      - run: python -m pytest --cov=custom_components.ninebot --cov-branch --cov-fail-under=95
