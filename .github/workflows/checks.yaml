name: Checks
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the full HA and frontend compatibility suites
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Core lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.16.10
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: github.event_name == 'workflow_dispatch' && inputs.full_validation
        with:
          node-version: '24'
      - if: github.event_name == 'workflow_dispatch' && inputs.full_validation
        run: node --test tests/frontend/*.mjs
  release-policy:
    name: Release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts/tests -p 'test_release.py'
      - run: python -m unittest discover -s scripts/tests -p 'test_release_package.py'
  test:
    # RC and major boundaries get one full run on the frozen candidate.
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    name: HA suite (${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            test-plugin: '0.13.305'
            ha: '2026.1.0'
          - python: '3.14'
            test-plugin: '0.13.373'
            ha: '2026.10.2'
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated test dependencies
        run: >-
          python -m pip install
          pytest-homeassistant-custom-component==${{ matrix.test-plugin }}
          homeassistant==${{ matrix.ha }} ninecli==0.1.7 mypy==2.4.0
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify the pinned Home Assistant test environment
        env:
          EXPECTED_HA: ${{ matrix.ha }}
        run: >-
          python -c 'import os; from importlib.metadata import version;
          assert version("homeassistant") == os.environ["EXPECTED_HA"]'
      - run: mypy custom_components/ninebot --follow-imports=silent
      - name: Run the complete offline suite
        run: >-
          python -m pytest --cov=custom_components.ninebot --cov-branch
          --cov-fail-under=91 --cov-report=term-missing --cov-report=xml
          --junitxml=test-results.xml -o faulthandler_timeout=60
      - name: Keep test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ha-${{ matrix.ha }}-reports
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
