name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.16.10
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - if: github.event_name == 'workflow_dispatch'
        run: node --test tests/frontend/*.mjs
  test:
    # Full compatibility runs are requested for major updates, not every beta.
    # A maintainer can dispatch this workflow on the branch/main being released.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            test-plugin: '0.13.305'
            ha: '2026.1.0'
          - python: '3.14'
            test-plugin: '0.13.370'
            ha: '2026.10.0'
          - python: '3.14'
            test-plugin: '0.13.370'
            ha: '2026.10.0b7'
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated test dependencies
        run: >-
          python -m pip install
          pytest-homeassistant-custom-component==${{ matrix.test-plugin }}
          ninecli==0.1.7 ruff==0.16.10 mypy==2.4.0
      # The latest test plugin still pins b4 when stable/b7 become available.
      # Explicitly install the selected Core and verify its actual version.
      - name: Install the selected Home Assistant boundary
        run: python -m pip install homeassistant==${{ matrix.ha }}
      - name: Verify the pinned Home Assistant test environment
        env:
          EXPECTED_HA: ${{ matrix.ha }}
        run: >-
          python -c 'import os; from importlib.metadata import version;
          assert version("homeassistant") == os.environ["EXPECTED_HA"]'
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: mypy custom_components/ninebot --follow-imports=silent
      - run: python -m pytest --cov=custom_components.ninebot --cov-branch --cov-fail-under=95
