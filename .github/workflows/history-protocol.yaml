name: History protocol
on:
  pull_request:
    paths:
      - 'custom_components/ninebot/native_history.py'
      - 'custom_components/ninebot/history_crypto.py'
      - 'custom_components/ninebot/client.py'
      - 'custom_components/ninebot/backend.py'
      - 'custom_components/ninebot/history_plan.py'
      - 'tests/test_native_history.py'
      - 'tests/test_history_plan.py'
      - '.github/workflows/history-protocol.yaml'
permissions:
  contents: read
concurrency:
  group: history-protocol-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: >-
          python -m pip install pytest-homeassistant-custom-component==0.13.305
          homeassistant==2026.1.0 ninecli==0.1.7 mypy==2.4.0
      - run: mypy custom_components/ninebot --follow-imports=silent
      - run: >-
          python -m pytest -q tests/test_native_history.py tests/test_backend.py
          tests/test_client.py tests/test_session.py tests/test_query_broker.py
          tests/test_history_plan.py
