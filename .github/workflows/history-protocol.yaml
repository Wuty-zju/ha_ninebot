name: History protocol
on:
  pull_request:
    paths:
      - 'custom_components/ninebot/native_history.py'
      - 'custom_components/ninebot/history_crypto.py'
      - 'custom_components/ninebot/client.py'
      - 'custom_components/ninebot/backend.py'
      - 'custom_components/ninebot/history_plan.py'
      - 'custom_components/ninebot/history_progress.py'
      - 'custom_components/ninebot/archive_audit.py'
      - 'custom_components/ninebot/object_checks.py'
      - 'custom_components/ninebot/local_reconstruction.py'
      - 'custom_components/ninebot/payload_restore.py'
      - 'custom_components/ninebot/recovery_search.py'
      - 'custom_components/ninebot/reconstruction_job.py'
      - 'custom_components/ninebot/background_reconstruction.py'
      - 'tests/test_local_reconstruction.py'
      - 'custom_components/ninebot/background_audit.py'
      - 'custom_components/ninebot/payload_inventory.py'
      - 'tests/test_archive_audit.py'
      - 'custom_components/ninebot/history_capacity.py'
      - 'custom_components/ninebot/diagnostics.py'
      - 'tests/test_history_capacity.py'
      - 'custom_components/ninebot/history_entities.py'
      - 'tests/test_history_entities.py'
      - 'tests/test_history_progress.py'
      - 'custom_components/ninebot/history_store.py'
      - 'custom_components/ninebot/incremental_sync.py'
      - 'custom_components/ninebot/incremental_runs.py'
      - 'custom_components/ninebot/detail_health.py'
      - 'custom_components/ninebot/bootstrap.py'
      - 'custom_components/ninebot/coordinator.py'
      - 'custom_components/ninebot/config_flow.py'
      - 'custom_components/ninebot/preservation.py'
      - 'custom_components/ninebot/ride_archive.py'
      - 'custom_components/ninebot/detail_codec.py'
      - 'tests/test_native_history.py'
      - 'tests/test_history_plan.py'
      - 'tests/test_history_store.py'
      - 'tests/test_bootstrap.py'
      - '.github/workflows/history-protocol.yaml'
permissions:
  contents: read
concurrency:
  group: history-protocol-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: >-
          python -m pip install pytest-homeassistant-custom-component==0.13.305
          homeassistant==2026.1.0 ninecli==0.1.7 mypy==2.4.0
      - run: mypy custom_components/ninebot --follow-imports=silent
      - run: >-
          python -m pytest -q tests/test_native_history.py tests/test_backend.py
          tests/test_client.py tests/test_session.py tests/test_query_broker.py
          tests/test_archive_audit.py tests/test_local_reconstruction.py tests/test_history_plan.py tests/test_history_progress.py
          tests/test_history_entities.py tests/test_history_capacity.py tests/test_translations.py tests/test_demand.py
          tests/test_setup_entities.py
          tests/test_history_store.py tests/test_ride_archive.py
          tests/test_private_detail_archive.py tests/test_archive_lifecycle.py
          tests/test_archive_validation.py
          tests/test_bootstrap.py tests/test_config_flow.py tests/test_coordinator.py
          tests/test_preservation.py
          tests/test_account_display.py
