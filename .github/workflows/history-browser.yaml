name: History browser
on:
  workflow_dispatch:
    inputs:
      apple_replay:
        description: Exercise overlapping routes and scrubbing in Apple Safari and an iPhone simulator
        type: boolean
        default: false
  pull_request:
    paths:
      - 'custom_components/ninebot/frontend/**'
      - 'tests/frontend/**'
      - 'tests/browser/**'
permissions:
  contents: read
concurrency:
  group: history-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    if: ${{ !inputs.apple_replay }}
    # Playwright 1.55.1 supports Ubuntu 24.04; keep browser/OS versions paired.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: scope
        if: github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'preview/')
        env:
          CI_PREVIEW_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci.py --plan --base "$BASE_SHA" --head "$HEAD_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test tests/frontend/*.mjs
        if: steps.scope.outputs.query_replay_preview != 'true'
      - name: Check archive paging and permission changes
        if: steps.scope.outputs.query_replay_preview == 'true'
        run: node --test tests/frontend/test_fleet_browser.mjs tests/frontend/test_history_network.mjs
      - name: Install isolated browser smoke tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/ninebot-browser" --no-save --package-lock=false playwright@1.55.1
          "$RUNNER_TEMP/ninebot-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render two synthetic archived vehicle routes
        env:
          BROWSER_TEST_DEPS: ${{ runner.temp }}/ninebot-browser
          BROWSER_TEST_OUTPUT: ${{ runner.temp }}/ninebot-map-smoke
          PREVIEW_SMOKE: ${{ steps.scope.outputs.query_replay_preview }}
        run: |
          if [ "$PREVIEW_SMOKE" = true ]; then
            node tests/browser/archive-replay.mjs
          else
            node tests/browser/history-map.mjs
          fi
      - name: Keep synthetic render evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-history-map
          path: ${{ runner.temp }}/ninebot-map-smoke
          if-no-files-found: error
          retention-days: 7

      - name: Review and cancel synthetic tasks in both languages and themes
        if: steps.scope.outputs.query_replay_preview != 'true'
        env:
          BROWSER_TEST_DEPS: ${{ runner.temp }}/ninebot-browser
          BROWSER_TEST_OUTPUT: ${{ runner.temp }}/ninebot-assistant-review
        run: node tests/browser/assistant-review.mjs
      - name: Keep synthetic task review evidence
        if: always() && steps.scope.outputs.query_replay_preview != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-assistant-review
          path: ${{ runner.temp }}/ninebot-assistant-review
          if-no-files-found: warn
          retention-days: 7

  safari:
    if: github.event_name == 'workflow_dispatch' && inputs.apple_replay
    name: Safari (${{ matrix.platform }})
    runs-on: macos-15
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, iOS]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Boot a disposable iPhone
        if: matrix.platform == 'iOS'
        run: |
          phone=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k), key=lambda k: tuple(map(int,k.split(".iOS-")[-1].split("-"))), reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_UDID=$phone" >> "$GITHUB_ENV"
          xcrun simctl boot "$phone"
          open -a "$(xcode-select -p)/Applications/Simulator.app" --args -CurrentDeviceUDID "$phone"
          xcrun simctl bootstatus "$phone" -b
          xcrun simctl spawn "$phone" defaults write com.apple.webinspectord RemoteAutomationEnabled -bool true
          xcrun simctl spawn "$phone" defaults write com.apple.mobilesafari AllowRemoteAutomation -bool true
          xcrun simctl launch "$phone" com.apple.mobilesafari
      - name: Select overlapping routes, inspect accessible controls and drag to a saved point
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          sudo safaridriver --enable
          safaridriver -p 4444 &
          trap 'kill $! || true' EXIT
          curl --retry 60 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4444/status
          node tests/browser/safari-replay.mjs "$PLATFORM"
