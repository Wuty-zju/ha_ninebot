name: History browser
on:
  pull_request:
    paths:
      - 'custom_components/ninebot/frontend/**'
      - 'tests/frontend/**'
      - 'tests/browser/**'
permissions:
  contents: read
concurrency:
  group: history-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test tests/frontend/*.mjs
      - name: Install isolated browser smoke tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/ninebot-browser" --no-save --package-lock=false playwright@1.55.1
          "$RUNNER_TEMP/ninebot-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render two synthetic archived vehicle routes
        env:
          BROWSER_TEST_DEPS: ${{ runner.temp }}/ninebot-browser
          BROWSER_TEST_OUTPUT: ${{ runner.temp }}/ninebot-map-smoke
        run: node tests/browser/history-map.mjs
      - name: Keep synthetic render evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-history-map
          path: ${{ runner.temp }}/ninebot-map-smoke
          if-no-files-found: error
          retention-days: 7
