name: Synthetic history profile
on:
  pull_request:
    paths:
      - 'scripts/profile_history.py'
      - 'custom_components/ninebot/archive_browse.py'
      - 'custom_components/ninebot/archive_timeline.py'
      - 'custom_components/ninebot/detail_codec.py'
      - 'custom_components/ninebot/archive_versions.py'
      - 'custom_components/ninebot/ride_archive.py'
permissions:
  contents: read
concurrency:
  group: history-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            custom_components/ninebot/manifest.json
            .github/ci.json
      - run: python scripts/ci.py --install minimum --profile
      - name: Prepare the base runtime with the identical profiler
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/ninebot-profile-baseline" "$BASELINE_REF"
          cp scripts/profile_history.py "$RUNNER_TEMP/ninebot-profile-baseline/scripts/profile_history.py"
      # Compare identical 5k workloads on one runner, including every track size.
      # Run 50k/200k locally in an existing environment or at a performance milestone.
      - name: Measure base runtime on this runner
        working-directory: ${{ runner.temp }}/ninebot-profile-baseline
        env:
          PROFILE_OUTPUT: ${{ runner.temp }}/ninebot-profile-baseline.json
        run: python -m scripts.profile_history --scales 5000 --output "$PROFILE_OUTPUT"
      - name: Measure candidate on the same runner
        env:
          PROFILE_OUTPUT: ${{ runner.temp }}/ninebot-profile-candidate.json
        run: python -m scripts.profile_history --scales 5000 --output "$PROFILE_OUTPUT"
      - name: Preserve structured measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-history-profile
          path: ${{ runner.temp }}/ninebot-profile*.json
          if-no-files-found: warn
          retention-days: 21
