name: Synthetic history profile
on:
  pull_request:
    paths:
      - 'scripts/profile_history.py'
      - '.github/workflows/history-profile.yaml'
      - 'custom_components/ninebot/archive_browse.py'
      - 'custom_components/ninebot/archive_timeline.py'
      - 'custom_components/ninebot/detail_codec.py'
      - 'custom_components/ninebot/archive_versions.py'
permissions:
  contents: read
concurrency:
  group: history-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            custom_components/ninebot/manifest.json
            .github/workflows/history-profile.yaml
      - run: python -m pip install homeassistant==2026.1.0 ninecli==0.1.7
      - name: Measure actual archive with synthetic data only
        env:
          PROFILE_OUTPUT: ${{ runner.temp }}/ninebot-profile.json
        run: python -m scripts.profile_history --output "$PROFILE_OUTPUT"
      - name: Preserve structured measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-history-profile
          path: ${{ runner.temp }}/ninebot-profile.json
          if-no-files-found: warn
          retention-days: 21
