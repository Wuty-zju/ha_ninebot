name: Focused statistics
on:
  pull_request:
    paths:
      - 'custom_components/ninebot/*statistics*.py'
      - 'custom_components/ninebot/ride_archive.py'
      - 'custom_components/ninebot/membership_recovery.py'
      - 'custom_components/ninebot/recorded_actions.py'
      - 'custom_components/ninebot/ride_models.py'
      - 'custom_components/ninebot/detail_codec.py'
      - 'custom_components/ninebot/preservation.py'
      - 'tests/test_preservation.py'
      - 'custom_components/ninebot/month_tasks.py'
      - 'custom_components/ninebot/month_sync.py'
      - 'custom_components/ninebot/sync_actions.py'
      - 'tests/test_month_tasks.py'
      - 'custom_components/ninebot/backup.py'
      - 'tests/test_private_detail_archive.py'
      - 'tests/test_recorded_trips.py'
      - 'custom_components/ninebot/travel.py'
      - 'tests/test_travel.py'
      - 'custom_components/ninebot/archive_runtime.py'
      - 'tests/test_accumulated_statistics.py'
permissions:
  contents: read
concurrency:
  group: statistics-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install minimum supported HA test environment
        run: >-
          python -m pip install
          pytest-homeassistant-custom-component==0.13.305
          homeassistant==2026.1.0 ninecli==0.1.7 mypy==2.4.0
      - run: mypy custom_components/ninebot --follow-imports=silent
      - name: Run related offline regression only
        run: >-
          python -m pytest -q
          tests/test_month_tasks.py
          tests/test_history_sync.py
          tests/test_preservation.py
          tests/test_query_broker.py
          tests/test_coordinator.py
          tests/test_private_detail_archive.py
          tests/test_local_reconstruction.py
          tests/test_recorded_trips.py
          tests/test_travel.py
          tests/test_services.py
          tests/test_accumulated_statistics.py
          tests/test_period_statistics.py
          tests/test_archive_runtime.py
          tests/test_ride_archive.py
          tests/test_statistics_actions.py
          tests/test_statistics_export.py
          tests/test_archive_timeline.py
          tests/test_calendar_history.py
